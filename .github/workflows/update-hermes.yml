name: Track upstream Hermes main

on:
  schedule:
    # Railway native template updates watch this repo. This workflow bridges
    # NousResearch/hermes-agent main -> a commit in this template repo.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hermes-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template repo
        uses: actions/checkout@v4

      - name: Read latest upstream Hermes main SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | cut -f1)"
          if [ -z "$sha" ]; then
            echo "Failed to resolve upstream Hermes main SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Latest upstream SHA: $sha"

      - name: Read current Dockerfile ref
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^ARG HERMES_REF=//p' Dockerfile | head -1)"
          echo "ref=$current" >> "$GITHUB_OUTPUT"
          echo "Current Dockerfile ref: $current"

      - name: Update Dockerfile ref
        if: steps.upstream.outputs.sha != steps.current.outputs.ref
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()
          sha = os.environ["UPSTREAM_SHA"]
          new_text, count = re.subn(
              r"^ARG HERMES_REF=.*$",
              f"ARG HERMES_REF={sha}",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Expected exactly one ARG HERMES_REF line in Dockerfile")
          dockerfile.write_text(new_text)
          PY

      - name: Commit and push update
        if: steps.upstream.outputs.sha != steps.current.outputs.ref
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: track Hermes upstream ${{ steps.upstream.outputs.sha }}"
          file_pattern: Dockerfile
